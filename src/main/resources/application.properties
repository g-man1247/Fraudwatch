# Spring Boot application configuration
# Urban Air Quality Monitoring & Industrial Emissions Fine Management Hub

# ─────────────────────────────────────────────
# MySQL DataSource Configuration
# ─────────────────────────────────────────────
# IMPORTANT: Replace YOUR_PASSWORD below with your actual MySQL root password
spring.datasource.url=jdbc:mysql://localhost:3306/air_quality_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=USER_MYSQL_PASSWORD
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ─────────────────────────────────────────────
# Hibernate / JPA Configuration
# ─────────────────────────────────────────────
# 'update' creates tables if missing and updates schema on changes
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ─────────────────────────────────────────────
# Server Port (default 8080)
# ─────────────────────────────────────────────
server.port=8080

# ─────────────────────────────────────────────
# Application Name
# ─────────────────────────────────────────────
spring.application.name=air-quality-monitoring
